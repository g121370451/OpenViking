project_name: "RAG_Benchmark"
dataset_name: "LegalBench_MAUD"

adapter:
  module: "src.adapters.legalbench_adapter"
  class_name: "LegalBenchAdapter"

execution:
  server_port: 20057
  max_workers: 10
  ingest_workers: 8
  retrieval_topk: 5
  max_queries: null
  ingest_mode: "directory"
  retrieval_instruction: ""
  generate_refusal_reason: true

question_rewrites:
  enabled: false
  cache_root: "rewrites"

paths:
  dataset_path: "datasets/LegalBench/benchmarks/maud.json"
  doc_output_dir: "ov_storage/LegalBench/LegalBench_processed_docs"
  vector_store: "ov_storage/LegalBench/LegalBench_viking_store_index"
  output_dir: "Output/LegalBench_MAUD/experiment_test_top_{retrieval_topk}_1_8_per_query"
  log_file: "Output/LegalBench_MAUD/experiment_test_top_{retrieval_topk}_1_8_per_query/benchmark.log"

llm:
  model: "doubao-seed-1-8-251228"
  temperature: 0
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: "${VOLCENGINE_API_KEY}"
