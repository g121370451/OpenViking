project_name: "RAG_Benchmark"

dataset_name: "LegalBench_CUAD"

adapter:
  module: "src.adapters.legalbench_adapter"
  class_name: "LegalBenchAdapter"

execution:
  server_port: 20066
  max_workers: 10
  ingest_workers: 8
  retrieval_topk: 5
  max_queries: null
  ingest_mode: "directory"
  retrieval_instruction: ""
  mode: "ov_fallback_bot"
  phase1_providers:
    primary: "raw_context_phase1_result"
    enabled:
      - "raw_context_phase1_result"
      - "raw_context_naive_rule"
    configs:
      raw_context_phase1_result:
        fallback_on_action_fallback: true
        fallback_on_insufficient: true
        fallback_on_missing_info: true
      raw_context_naive_rule:
        fallback_on_action_fallback: true
        fallback_on_insufficient: true
        fallback_on_refusal_like_answer: true

vikingbot:
  max_iterations: 15
  log_tool_calls: true
  use_relations: false
  enable_linking: false
paths:
  dataset_path: "datasets/LegalBench/benchmarks/cuad.json"
  doc_output_dir: "ov_storage/LegalBench/LegalBench_processed_docs"
  vector_store: "ov_storage/LegalBench/LegalBench_viking_store_index"
  output_dir: "Output/LegalBench_CUAD/experiment_ov_fallback_bot_top_{retrieval_topk}"
  log_file: "Output/LegalBench_CUAD/experiment_ov_fallback_bot_top_{retrieval_topk}/benchmark.log"

llm:
  model: "doubao-seed-1-8-251228"
  temperature: 0
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: "${VOLCENGINE_API_KEY}"
question_rewrites:
  enabled: false
  cache_root: "rewrites"
