project_name: "RAG_Benchmark"

# FinanceBench 的 BookRAG benchmark 配置。
# 启动前需要 TOKENROUTER_API_KEY、VOLCENGINE_API_KEY、
# VIKINGDB_RERANK_AK 和 VIKINGDB_RERANK_SK 环境变量。
dataset_name: "FinanceBench"

adapter:
  module: "src.adapters.financebench_adapter"
  class_name: "FinanceBenchAdapter"

execution:
  mode: "bookrag"
  max_workers: 4
  ingest_workers: 4
  retrieval_topk: 5
  max_queries: null
  ingest_mode: "dataset"
  retrieval_instruction: ""
  use_vikingbot: false

paths:
  dataset_path: "datasets/{dataset_name}/financebench_open_source.jsonl"
  doc_output_dir: "ov_storage/{dataset_name}/{dataset_name}_processed_docs"
  # BookRAG 使用 bookrag.index_dir；保留 vector_store 以满足通用 benchmark 配置契约。
  vector_store: "ov_storage/{dataset_name}/{dataset_name}_bookrag_index"
  output_dir: "Output/{dataset_name}/experiment_bookrag_top_{retrieval_topk}"
  log_file: "Output/{dataset_name}/experiment_bookrag_top_{retrieval_topk}/benchmark.log"

# 同时用于 BookIndex 构建、query planner、答案生成和 benchmark 评测。
llm:
  model: "gpt-5.5"
  provider: "openai"
  temperature: 0
  max_tokens: 4096
  base_url: "https://www.tokenrouter.tech/v1"
  api_key: "${TOKENROUTER_API_KEY}"

# BookRAG Core 的文本 embedding。这里沿用仓库已有的方舟多模态 embedding，
# provider 会以 text input 调用它。
embedding:
  model: "doubao-embedding-vision-250615"
  backend: "volcengine"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: "${VOLCENGINE_API_KEY}"
  max_length: 8192
  max_workers: 8

bookrag:
  index_dir: "ov_storage/{dataset_name}/{dataset_name}_bookrag_index"

  index:
    chunk_size: 512
    overlap: 50
    tokenizer: "cl100k_base"

  tree:
    node_summary: true
    node_keywords: true

  graph:
    extractor_type: "llm"
    refine_type: "advanced"
    similarity_threshold: 0.6

  gbc:
    variant: "standard"
    topk: 5
    select_depth: 2
    topk_ent: 5
    sim_threshold_e: 0.3
    alpha: 0.5
    x_percentile: 0.85
    max_retry: 3

  # 直接调用 VikingDB 的签名 rerank API，不需要单独启动本地服务。
  reranker:
    backend: "vikingdb"
    ak: "${VIKINGDB_RERANK_AK}"
    sk: "${VIKINGDB_RERANK_SK}"
    host: "api-vikingdb.vikingdb.cn-beijing.volces.com"
    model: "doubao-seed-rerank"
    model_version: "251028"
    threshold: 0.1
    batch_size: 100
    max_length: 8192

question_rewrites:
  enabled: false
  cache_root: "rewrites"
