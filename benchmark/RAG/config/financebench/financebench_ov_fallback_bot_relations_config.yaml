project_name: "RAG_Benchmark"

dataset_name: "FinanceBench"

adapter:
  module: "src.adapters.financebench_adapter"
  class_name: "FinanceBenchAdapter"

execution:
  server_port: 19978
  max_workers: 10
  ingest_workers: 8
  retrieval_topk: 5
  max_queries: null
  ingest_mode: "directory"
  retrieval_instruction: ""
  mode: "ov_fallback_bot_relations"
  relations_similarity_threshold: 0.8
  relations_topk: 3
  phase1_providers:
    primary: "raw_context_phase1_result"
    enabled:
      - "raw_context_phase1_result"
    configs:
      raw_context_phase1_result:
        fallback_on_action_fallback: true
        fallback_on_insufficient: true
        fallback_on_missing_info: true

vikingbot:
  max_iterations: 15
  log_tool_calls: true
  use_relations: true
  relations_topk: 3
  relations_similarity_threshold: 0.8
  enable_linking: false
paths:
  dataset_path: "datasets/{dataset_name}/financebench_open_source.jsonl"
  doc_output_dir: "ov_storage/{dataset_name}/{dataset_name}_processed_docs"
  vector_store: "ov_storage/{dataset_name}/{dataset_name}_viking_store_index"
  output_dir: "Output/{dataset_name}/experiment_ov_fallback_bot_relations_top_{retrieval_topk}"
  log_file: "Output/{dataset_name}/experiment_ov_fallback_bot_relations_top_{retrieval_topk}/benchmark.log"

llm:
  model: "doubao-seed-1-8-251228"
  temperature: 0
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: "${VOLCENGINE_API_KEY}"
embedding:
  model: "doubao-embedding-vision-250615"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: "${VOLCENGINE_API_KEY}"
question_rewrites:
  enabled: false
  cache_root: "rewrites"

