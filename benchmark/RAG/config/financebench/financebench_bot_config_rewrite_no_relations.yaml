project_name: "RAG_Benchmark"

# ===========Modify Configuration================
dataset_name: "FinanceBench" 

adapter:
  module: "src.adapters.financebench_adapter"  
  class_name: "FinanceBenchAdapter"     

execution:
  server_port: 19973
  max_workers: 10
  ingest_workers: 8
  retrieval_topk: 1
  max_queries: null
  ingest_mode: "directory"
  retrieval_instruction: ""  
  use_vikingbot: true
# ==================================  

# ===========VikingBot Configuration============
vikingbot:
  max_iterations: 15
  log_tool_calls: true
  use_relations: false
  enable_linking: false
paths:
  dataset_path: "datasets/{dataset_name}/financebench_open_source.jsonl"
  doc_output_dir: "ov_storage/{dataset_name}/{dataset_name}_processed_docs"
  vector_store: "ov_storage/{dataset_name}/{dataset_name}_viking_store_index"
  output_dir: "Output/{dataset_name}/experiment_test_bot_rewrite_no_relations_top_{retrieval_topk}"
  log_file: "Output/{dataset_name}/experiment_test_bot_rewrite_no_relations_top_{retrieval_topk}/benchmark.log"


llm:
  model: "doubao-seed-1-8-251228"
  temperature: 0
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: "${VOLCENGINE_API_KEY}"
question_rewrites:
  enabled: true
  cache_root: "rewrites"
  max_workers: 10
  max_attempts: 3
