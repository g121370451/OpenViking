project_name: "RAG_Benchmark"

# ===========Modify Configuration================
# Build links with cross-iteration strategy. Only links docs from different iterations.
dataset_name: "Qasper"

adapter:
  module: "src.adapters.qasper_adapter"
  class_name: "QasperAdapter"

execution:
  max_workers: 10
  ingest_workers: 8
  retrieval_topk: 1
  max_queries: null
  skip_ingestion: true
  ingest_mode: "directory"
  retrieval_instruction: ""
  use_vikingbot: true
# ==================================

# ===========VikingBot Configuration============
vikingbot:
  max_iterations: 10
  log_tool_calls: true
  enable_linking: true
  link_strategy: cross_iteration
  enable_reasoning: false

paths:
  dataset_path: "datasets/{dataset_name}/qasper_dev.json"
  doc_output_dir: "ov_storage/{dataset_name}/{dataset_name}_processed_docs"
  vector_store: "ov_storage/{dataset_name}/{dataset_name}_viking_store_index"
  output_dir: "Output/{dataset_name}/experiment_test_bot_top_{retrieval_topk}_build_links_cross_iter"
  log_file: "Output/{dataset_name}/experiment_test_bot_top_{retrieval_topk}_build_links_cross_iter/benchmark.log"


llm:
  model: "doubao-seed-1-8-251228"
  temperature: 0
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: "${VOLCENGINE_API_KEY}"
embedding:
  model: "doubao-embedding-vision-250615"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: "${VOLCENGINE_API_KEY}"
