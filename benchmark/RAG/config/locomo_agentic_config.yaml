project_name: "RAG_Benchmark"

# ===========Modify Configuration================
dataset_name: "Locomo"

adapter:
  module: "src.adapters.locomo_adapter"
  class_name: "LocomoAdapter"

execution:
  max_workers: 30
  ingest_workers: 8
  retrieval_topk: 5
  max_queries: 20
  skip_ingestion: true
  ingest_mode: "directory"
  retrieval_instruction: ""
  use_agentic_rag: true
# ==================================

# ===========Agentic RAG Configuration============
agentic_rag:
  max_iterations: 10
  model: "doubao-seed-1-8-251228"
  temperature: 0
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: "269f7ee6-212a-4f46-9472-978a55cdb625"

paths:
  dataset_path: "datasets/{dataset_name}/locomo10.json"
  doc_output_dir: "ov_storage/{dataset_name}/{dataset_name}_processed_docs"
  vector_store: "ov_storage/{dataset_name}/{dataset_name}_viking_store_index"
  output_dir: "Output/{dataset_name}/experiment_agentic_rag_top_{retrieval_topk}"
  log_file: "Output/{dataset_name}/experiment_agentic_rag_top_{retrieval_topk}_benchmark.log"

llm:
  model: "doubao-seed-1-8-251228"
  temperature: 0
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: "269f7ee6-212a-4f46-9472-978a55cdb625"
