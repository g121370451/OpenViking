project_name: "RAG_Benchmark"

# ===========Modify Configuration================
dataset_name: "Locomo" 

adapter:
  module: "src.adapters.locomo_adapter"  
  class_name: "LocomoAdapter"     

execution:
  max_workers: 10
  ingest_workers: 5
  retrieval_topk: 5
  max_queries: null
  skip_ingestion: false
  ingest_mode: "directory"
  retrieval_instruction: ""  
# ==================================  

paths:
  dataset_path: "datasets/{dataset_name}/locomo10.json"
  doc_output_dir: "ov_storage/{dataset_name}/{dataset_name}_processed_docs"
  vector_store: "ov_storage/{dataset_name}/{dataset_name}_viking_store_index"
  output_dir: "Output/{dataset_name}/experiment_test_top_{retrieval_topk}_1_8_per_query"
  log_file: "Output/{dataset_name}/experiment_test_top_{retrieval_topk}_1_8_per_query/benchmark.log"


llm:
  model: "doubao-seed-1-8-251228"
  temperature: 0
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: ""
  api_key_env_var: "VOLCENGINE_API_KEY"
