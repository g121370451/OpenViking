metadata:
  id: "semantic.document_summary"
  name: "Document File Summary Generation"
  description: "Generate summary for documentation files (Markdown, Text, RST, etc.) with focus on content structure, key topics, and main points"
  version: "1.0.0"
  language: "en"
  category: "semantic"

variables:
  - name: "file_name"
    type: "string"
    description: "File name with extension"
    required: true

  - name: "content"
    type: "string"
    description: "File content (documentation text)"
    required: true

  - name: "output_language"
    type: "string"
    description: "Language code for output (e.g., 'en', 'zh-CN', 'ja', 'ko', 'ru', 'ar')"
    required: true

template: |
  Output Language: {{ output_language }}

  You are an expert in creating routing summaries for Agentic RAG systems.
  Your task is to generate a compact indexing summary for the provided document chunk.
  This summary will be read by an AI Agent to decide whether to read this chunk for single-hop or multi-hop reasoning.

  <Constraints>
  - Purpose: Information scent for Agent retrieval decisions.
  - Style: Dense, specific, telegraphic. Start directly with the core subject.
  - STRICTLY FORBIDDEN meta-padding, e.g., "This document is...", "This chunk covers...", "The text describes...".
  - Accuracy: Extract strictly from the chunk. Preserve exact entity names, technical terms, code identifiers, and numeric values. Do not hallucinate.
  - Total length: Maximum 160 words.
  - If content is too dense, prioritize: 1) core entities and relationships, 2) navigational mappings, 3) most important numeric data, 4) answer patterns.
  - Do not list every value if doing so exceeds the limit; select the most retrieval-critical values and mention ranges or representative values only when explicit in the chunk.
  </Constraints>

  <Content_Requirements>
  To support multi-hop reasoning, capture:
  - Key entities and their relationships in the Core sentence.
  - Exact numeric data points with units and time periods when available. Numbers without context are useless.
  - Specific relationships between entities, e.g., "A acquired B in 2019", "function X calls Y with parameter Z".
  - Navigational mappings if present, e.g., "Topic X → see File Y".
  - For tabular data: preserve important row-column relationships as compact key-value pairs. Prefer final totals, named metrics, and rows with clear labels.
  </Content_Requirements>

  <Output_Format>
  Core: [1-2 dense sentences: first state the core subject and key entities and their relationships, then enumerate the main sub-topics the chunk covers, e.g., "Sony's PlayStation 3 (successor to PS2, competing with Xbox 360) covering hardware specs, launch history, regional pricing, and backward compatibility." Max 100 words.]
  Data: [Comma-separated exact metrics, values, or code signatures with context, use "None" if no concrete data.]
  Can answer: [Max 3 short phrases describing what this chunk resolves; each max 10 words. Good: "lead single from Confessions album", "song blocked at #2 by Yeah!". Bad: "What was the lead single?", "information about music charts".]
  </Output_Format>

  <Input>
  File Name: {{ file_name }}
  Chunk Content:
  {{ content }}
  </Input>


llm_config:
  temperature: 0.0
